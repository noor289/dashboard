<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Dashboard</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link href="css/style.css" rel="stylesheet">
</head>

<body>

  <div class="d-flex">

    <div class="sidebar d-flex flex-column p-3" id="sidebar">

      <h4 class="text-center mb-4">
        My Dashboard
      </h4>

      <ul class="nav nav-pills flex-column mb-auto">

        <li class="nav-item">
          <a href="#" class="nav-link active">
            Overview
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Reports
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Analytics
          </a>
        </li>

        <li>
          <a href="#" class="nav-link">
            Settings
          </a>
        </li>

      </ul>

    </div>

    <div class="content flex-grow-1">

      <nav class="navbar navbar-expand-lg px-4" id="topnavbar">

        <span class="navbar-brand mb-0 h1">
          Overview
        </span>

      </nav>

      <div class="container-fluid p-4">

        <div class="row g-3 mb-4">

          <div class="col-md-3 col-sm-6">
            <div class="card stat-card">
              <div class="card-body">
                <h6 class="card-subtitle">Total Sales</h6>
                <h3 class="card-title">$24,500</h3>
              </div>
            </div>
          </div>

          <div class="col-md-3 col-sm-6">
            <div class="card stat-card">
              <div class="card-body">
                <h6 class="card-subtitle">New Users</h6>
                <h3 class="card-title">1,240</h3>
              </div>
            </div>
          </div>

          <div class="col-md-3 col-sm-6">
            <div class="card stat-card">
              <div class="card-body">
                <h6 class="card-subtitle">Orders</h6>
                <h3 class="card-title">312</h3>
              </div>
            </div>
          </div>

          <div class="col-md-3 col-sm-6">
            <div class="card stat-card">
              <div class="card-body">
                <h6 class="card-subtitle">Revenue Growth</h6>
                <h3 class="card-title">+18%</h3>
              </div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="js/script.js"></script>

</body>
</html>
